# 基于 MusicFlow 主仓库发布的多架构镜像做一层薄封装。
#
# 主仓库 CI(.github/workflows/build.yml)推 main 时刷新 :latest,打 v* tag 时
# 额外发布 :<版本号>(去掉 v 前缀)。这里固定到具体版本而不是 :latest ——
# Supervisor 只在 config.yaml 的 version 变化时才重建镜像,跟 :latest 的话
# 用户看到的"最新版"会随主仓库每次推送悄悄漂移,出问题也无从回滚。
#
# 升级流程:主仓库打新 tag → 这里改版本号 → config.yaml 的 version 一起改。
build_from:
  amd64: ghcr.io/ray5378/musicflow:1.0.5
  aarch64: ghcr.io/ray5378/musicflow:1.0.5
labels:
  org.opencontainers.image.title: MusicFlow Add-on
  org.opencontainers.image.source: https://github.com/ray5378/hassio-addons
  org.opencontainers.image.licenses: MIT
