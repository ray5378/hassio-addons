# 基于 MusicFlow-V2 仓库发布的多架构镜像做一层薄封装。
#
# V2 仓库 CI(.github/workflows/build.yml)打 v* tag 时发布
# ghcr.io/ray5378/musicflow-v2:<版本> + :latest。这里固定到具体版本而不是
# :latest —— Supervisor 只在 config.yaml 的 version 变化时才重建镜像,跟
# :latest 的话用户看到的"最新版"会随发版悄悄漂移,出问题也无从回滚。
#
# 镜像仅 amd64(V2 账号没有 ARM runner,aarch64 暂不支持)。
# 升级流程:V2 仓库打新 tag → 这里改版本号 → config.yaml 的 version 一起改。
build_from:
  amd64: ghcr.io/ray5378/musicflow-v2:1.7.2
labels:
  org.opencontainers.image.title: MusicFlow Add-on
  org.opencontainers.image.source: https://github.com/ray5378/hassio-addons
  org.opencontainers.image.licenses: MIT
