# 基于 MusicFlow 主仓库发布的多架构镜像做一层薄封装。
# 主仓库 CI(.github/workflows/build.yml)在每次推 main 时刷新 :latest,
# 打 v* tag 时额外发布 :<版本号>。这里跟 :latest 走,配合 config.yaml 的
# version 字段控制何时重建(Supervisor 构建时带 --pull,会拉到最新的 latest)。
build_from:
  amd64: ghcr.io/ray5378/musicflow:latest
  aarch64: ghcr.io/ray5378/musicflow:latest
labels:
  org.opencontainers.image.title: MusicFlow Add-on
  org.opencontainers.image.source: https://github.com/ray5378/hassio-addons
  org.opencontainers.image.licenses: MIT
